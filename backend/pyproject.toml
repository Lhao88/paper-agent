[project]
name = "academic-workbench"
version = "0.1.0"
description = "Evidence-grounded multi-agent academic research workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "psycopg[binary,pool]>=3,<4",
  "alembic>=1,<2",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "mcp[cli]>=2,<3",
  "pdfplumber>=0.11,<1",
  "defusedxml>=0.7,<1",
  "rank-bm25>=0.2,<1",
  "rapidfuzz>=3,<4",
  "python-multipart>=0.0.18,<1",
  "jinja2>=3,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff",
  "mypy",
  "reportlab>=4,<5",
  "types-defusedxml>=0.7.0.20260504",
  "types-reportlab>=5.0.0.20261008",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires a dedicated PostgreSQL test database",
  "live: requires explicit external service access",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
